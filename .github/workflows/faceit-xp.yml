name: "FACEIT · procesador de partidas (XP + rango)"

# Convierte los eventos que el worker de FACEIT guarda en faceit_webhook_events
# en XP + movimiento de rango en la base (faceit_procesar_eventos, migración 10).
# Corre cada 10 minutos y también a mano (Run workflow).
#
# Migración Neon -> Supabase: la cadena ya no se resuelve con la API de Neon
# (NEON_API_KEY); se usa el secreto DATABASE_URL directamente. Su VALOR decide
# la base: cadena de Neon durante el paralelo, de Supabase tras el corte.

on:
  schedule:
    # NOTA: evaluar bajar frecuencia si el coste de runs no justifica */10
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: faceit-xp
  cancel-in-progress: true  # si una corrida se cuelga, la siguiente la cancela

# Mínimo privilegio
permissions:
  contents: read

jobs:
  procesar:
    runs-on: ubuntu-latest
    # 144 runs/día: sin esto, una corrida colgada encola en cascada hasta 6 h
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # El contexto `secrets` NO está disponible en los `if` de los pasos:
      # GitHub rechaza el workflow completo ("Unrecognized named-value").
      # Se mapean a env del job para poder usarlos en la condición del paso.
      FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
      FACEIT_DISCORD_WEBHOOK: ${{ secrets.FACEIT_DISCORD_WEBHOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Comprobar acceso a la base
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secreto DATABASE_URL (Settings → Secrets and variables → Actions). Desde la migración a Supabase sustituye a NEON_API_KEY."
            exit 1
          fi

      - name: Corte de conexión psql (anti-cuelgue)
        run: echo "PGCONNECT_TIMEOUT=10" >> "$GITHUB_ENV"

      - name: Procesar partidas FACEIT pendientes
        run: |
          # psql NO tiene la opción CLI --connect-timeout: el corte de conexión
          # lo hace la variable de libpq PGCONNECT_TIMEOUT (ya exportada arriba).
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -c "SELECT faceit_procesar_eventos();"

      # Respaldo del webhook: sondea la Data API v4 y registra partidas que
      # el webhook no alcanzó a entregar (idempotente por faceit_match_id).
      - name: Sondear historial FACEIT (respaldo del webhook)
        if: ${{ env.FACEIT_API_KEY != '' }}
        run: node scripts/faceit-xp.mjs
