name: "Neon · migraciones de la base real"

# DEPRECATED (migración Neon -> Supabase): las migraciones oficiales viven en
# VANTSNET/VantsBasededatos (fuente de verdad). Este duplicado se apaga tras el
# corte; mientras dure el paralelo sigue aplicando en Neon.

# Aplica las migraciones SQL idempotentes de db/migrations/ contra la rama
# br-sweet-shape-b42xhogj del proyecto Neon square-surf-41242074 (base neondb).
#
# Requiere 1 secreto:  NEON_API_KEY  (https://console.neon.tech/app/settings/api-keys)
#   Settings → Secrets and variables → Actions → New repository secret
#
# Se ejecuta: manualmente (Run workflow) o al cambiar db/migrations/*.sql
# Nota: la clave se inyecta como variable de entorno NK (desde el almacén de
# secretos de Actions) y se pasa al CLI con --api-key; nunca va en el archivo.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "db/migrations/*.sql"
      - ".github/workflows/neon-migrate.yml"
      - "docs/estado-db.sql"

# Fase 6 · despliegues controlados: migraciones de a una, el resto en cola
concurrency:
  group: deploy-prod
  cancel-in-progress: false

# Para publicar estado-db.json en la rama estado-db (verificación del
# estado real de la base sin exponer credenciales)
permissions:
  contents: write

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # environment: production  (configurar en Settings→Environments con revisores)
    env:
      NK: ${{ secrets.NEON_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        env:
          # psql corta en 10 s si la BD no responde (no cuelga el runner 6 h)
          PGCONNECT_TIMEOUT: "10"

      - name: Comprobar acceso a Neon
        run: |
          if [ -z "$NK" ]; then
            echo "::error::Falta el secreto NEON_API_KEY. Créalo en https://console.neon.tech/app/settings/api-keys y añádelo en Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - name: Install Neon CLI
        run: npm install -g neon@latest

      - name: Resolver cadena de conexión (Neon CLI)
        run: |
          neon --version
          CS=$(neon connection-string ${{ vars.NEON_BRANCH_ID || 'br-sweet-shape-b42xhogj' }} \
            --project-id ${{ vars.NEON_PROJECT_ID || 'square-surf-41242074' }} \
            --database neondb --api-key "$NK" 2>/tmp/cs_err || true)
          if [ -z "$CS" ]; then
            CS=$(neon cs br-sweet-shape-b42xhogj \
              --project-id square-surf-41242074 \
              --database neondb --api-key "$NK" 2>/dev/null || true)
          fi
          if [ -z "$CS" ]; then
            echo "::error::Neon CLI no devolvió cadena de conexión. Diagnóstico:"
            cat /tmp/cs_err 2>/dev/null || true
            neon projects list --api-key "$NK" || true
            neon branches list --project-id square-surf-41242074 --api-key "$NK" || true
            exit 1
          fi
          echo "::add-mask::$CS"
          echo "NEON_CS=$CS" >> "$GITHUB_ENV"
          echo "✅ Cadena de conexión resuelta (oculta en el log)"

      - name: Aplicar migraciones (idempotentes)
        run: |
          psql --version
          set +e
          FALLIDA=""
          for f in db/migrations/*.sql; do
            echo "════════ ▶ $f ════════"
            if ! psql "$NEON_CS" -v ON_ERROR_STOP=1 -f "$f" 2> /tmp/mig_err.txt; then
              echo "::error::MIGRACION FALLIDA: $f"
              cat /tmp/mig_err.txt
              FALLIDA="$f"
              break
            fi
          done
          if [ -n "$FALLIDA" ]; then echo "❌ Migraciones detenidas en $FALLIDA"; exit 1; fi
          echo "✅ Migraciones aplicadas"

      - name: Resumen de la base (tablas y filas)
        if: always() && env.NEON_CS != ''
        run: |
          psql "$NEON_CS" -c "SELECT relname AS tabla, n_live_tup AS filas_aprox FROM pg_stat_user_tables WHERE schemaname = 'public' ORDER BY relname;" || true

      - name: Diagnóstico invitaciones mm (mascarado, sin PII)
        if: always() && env.NEON_CS != ''
        run: |
          set +e
          echo "— inventario de players —"
          psql "$NEON_CS" -c "SELECT count(*) FILTER (WHERE auth0_sub IS NOT NULL) AS con_sesion, count(*) FILTER (WHERE coalesce(btrim(email),'') <> '') AS con_email, count(*) AS total FROM players;"
          echo "— perfiles (email mascarado) —"
          psql "$NEON_CS" -c "SELECT coalesce(nullif(username,''),'?') AS username, coalesce(nullif(display_name,''),'?') AS nombre, CASE WHEN auth0_sub IS NULL THEN 'sin_sesion' ELSE 'con_sesion' END AS sesion, CASE WHEN coalesce(btrim(email),'')='' THEN '(sin email)' ELSE left(btrim(email),3)||'***'||split_part(btrim(email),'@',2) END AS email_mascarado, created_at::date AS creado FROM players ORDER BY created_at LIMIT 20;"
          echo "— emails compartidos por varios perfiles —"
          psql "$NEON_CS" -c "SELECT left(btrim(email),3)||'***'||split_part(btrim(email),'@',2) AS email_mascarado, count(*) AS perfiles, count(*) FILTER (WHERE auth0_sub IS NOT NULL) AS con_sesion FROM players WHERE coalesce(btrim(email),'')<>'' GROUP BY 1 HAVING count(*) > 1;"
          echo "— mm_invites por estado —"
          psql "$NEON_CS" -c "SELECT status, count(*) FROM mm_invites GROUP BY 1 ORDER BY 2 DESC;" || true

      - name: Estado de la base → rama estado-db (verificación legible)
        if: always() && env.NEON_CS != ''
        run: |
          set +e
          psql "$NEON_CS" -qAt -f docs/estado-db.sql > estado-db.json 2> estado-db-error.txt
          CODIGO=$?
          echo "codigo psql: $CODIGO"
          echo "--- stderr ---"
          head -c 700 estado-db-error.txt
          echo ""
          echo "--- salida ---"
          head -c 200 estado-db.json
          echo ""
          if [ "$CODIGO" -ne 0 ] || [ ! -s estado-db.json ]; then
            echo '{"error": "no se pudo leer la base"}' > estado-db.json
            echo "::warning::estado-db fallo (codigo $CODIGO)"
          fi
          if [ -f /tmp/mig_err.txt ]; then cp /tmp/mig_err.txt migracion-error.txt; else echo "(sin errores de migracion en esta ejecucion)" > migracion-error.txt; fi
          git config user.name "vants-estado-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B estado-db
          git add -f estado-db.json estado-db-error.txt migracion-error.txt
          git commit -m "Estado de la base (automatico)" || echo "sin cambios en el estado"
          git push -f origin estado-db || echo "::warning::no se pudo publicar la rama estado-db"
