name: "Cloudflare · deploy del Worker (vants)"

# Despliegue del Worker desde GitHub Actions usando CLOUDFLARE_API_TOKEN
# (secret del repo). Pipeline fiable e independiente de Workers Builds.
on:
  push:
    branches: [main]
    paths:
      - "vants-server/**"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

# Fase 6 · despliegues controlados: un deploy a la vez, el resto en cola
concurrency:
  group: deploy-prod
  cancel-in-progress: false

# Mínimo privilegio: el deploy no toca el repo
permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'VANTSNET/vants-dev-launcher'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Instalar dependencias (npm ci)
        working-directory: vants-server
        run: npm ci

      - name: Deploy del Worker a Cloudflare
        working-directory: vants-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '8f2424e95fec4860e19257226f209fbc' }}
        run: npx wrangler deploy

      # Activa la agenda Valorant en vivo (api.henrikdev.xyz) sin exponer la
      # clave: vive cifrada en los secrets del repo y solo llega al Worker.
      - name: Secret HENRIKDEV_API_KEY (agenda Valorant en vivo)
        working-directory: vants-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '8f2424e95fec4860e19257226f209fbc' }}
          HENRIKDEV_API_KEY: ${{ secrets.HENRIKDEV_API_KEY }}
        run: |
          if [ -n "$HENRIKDEV_API_KEY" ]; then
            printf '%s' "$HENRIKDEV_API_KEY" | npx wrangler secret put HENRIKDEV_API_KEY
          else
            echo "HENRIKDEV_API_KEY sin definir: la agenda usa el fallback real de vlr.gg"
          fi

      # Eventos de Discord: public key para verificar la firma Ed25519 del
      # Developer Portal (/api/discord/events) y secret del puente hacia
      # vantsbot (Neon Functions) que guarda los eventos en Neon.
      # Idempotente; si un secret falta, el Worker conserva el que ya tenga.
      - name: Secrets del Worker (Discord events + puente vantsbot)
        working-directory: vants-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '8f2424e95fec4860e19257226f209fbc' }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          VANTS_BOT_SECRET: ${{ secrets.VANTS_BOT_SECRET }}
        run: |
          for N in DISCORD_PUBLIC_KEY VANTS_BOT_SECRET; do
            eval "V=\$$N"
            if [ -n "$V" ]; then
              printf '%s' "$V" | npx wrangler secret put "$N"
            else
              echo "$N sin definir en el repo: se conserva el que ya tenga el Worker"
            fi
          done

      # URL corta de marca: workers.dev exige el formato <worker>.<subdominio>.
      # Con subdominio "vants" la web queda en https://vants.vants.workers.dev
      # (el dominio exacto vants.workers.dev no existe como URL de Worker).
      # Seguro e idempotente: solo cambia si el subdominio actual es otro, y si
      # el nuevo nombre estuviera ocupado restaura el anterior para que la
      # cuenta nunca quede sin URL.
      - name: Subdominio workers.dev → vants (URL corta)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '8f2424e95fec4860e19257226f209fbc' }}
        run: |
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                       -H "Content-Type: application/json" "$@"; }
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          CUR=$(api "$BASE" | python3 -c "import json,sys;print(json.load(sys.stdin).get('result',{}).get('subdomain',''))")
          echo "Subdominio actual: '$CUR'"
          if [ "$CUR" = "vants" ]; then echo "Ya es 'vants': nada que hacer."; exit 0; fi
          [ -n "$CUR" ] && { echo "Liberando '$CUR'..."; api -X DELETE "$BASE"; }
          for N in vants vantsgg "$CUR"; do
            [ -z "$N" ] && continue
            CODE=$(api -o /tmp/sub.json -w '%{http_code}' -X PUT "$BASE" --data "{\"subdomain\":\"$N\"}")
            echo "PUT '$N' → HTTP $CODE $(cat /tmp/sub.json | tr -d '\n' | head -c 200)"
            [ "$CODE" = "200" ] && { echo "SUBDOMINIO FINAL: $N"; exit 0; }
          done
          echo "No se pudo fijar 'vants' (quizá ocupado); se conserva '$CUR'"
