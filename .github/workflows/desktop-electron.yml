name: "VANTS HUB · instalador Windows (Electron)"

# Compila el instalador NSIS de VANTS HUB (Electron) en un runner
# Windows real y lo publica en GitHub Releases al crear un tag v*.
# En tags, electron-builder sube el .exe + latest.yml + blockmap a un
# release BORRADOR (draft) y luego se publica — pieza que consume
# electron-updater para las ACTUALIZACIONES AUTOMÁTICAS del HUB.
# El borrador es la vía correcta: este repo tiene "Immutable releases"
# activo y un release publicado rechaza assets (HTTP 422).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Fase 6 · despliegues controlados: un build/Release a la vez
concurrency:
  group: deploy-desktop-electron
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  instalar-windows:
    if: github.repository == 'VANTSNET/vants-dev-launcher'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Instalar dependencias (npm ci — lockfile commiteado)
        working-directory: desktop-electron
        run: npm ci

      - name: Compilar instalador (NSIS x64)
        working-directory: desktop-electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if ("$env:GITHUB_REF" -like 'refs/tags/v*') {
            npx electron-builder --win nsis --x64 --publish always
          } else {
            npx electron-builder --win nsis --x64 --publish never
          }

      - name: Subir artefacto del build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vants-hub-windows
          path: desktop-electron/dist/*.exe
          if-no-files-found: error

      - name: Publicar el borrador del release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF.Replace('refs/tags/','')
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $rels = Invoke-RestMethod -Headers $h -Uri "https://api.github.com/repos/feispla/Vants/releases?per_page=100"
          $draft = $rels | Where-Object { $_.draft -eq $true -and $_.tag_name -eq $tag } | Select-Object -First 1
          if ($draft) {
            $body = @{ draft = $false; generate_release_notes = $true } | ConvertTo-Json
            Invoke-RestMethod -Method PATCH -Headers $h -ContentType 'application/json' -Uri "https://api.github.com/repos/feispla/Vants/releases/$($draft.id)" -Body $body | Out-Null
            Write-Host "Release $tag publicado · assets: $($draft.assets | ForEach-Object { $_.name })"
          } else {
            Write-Host "No hay borrador para $tag (¿ya publicado antes?)"
          }
